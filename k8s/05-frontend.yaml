apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: travelverse
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: souravdasdocker/travelverse-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
          limits:
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: travelverse
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

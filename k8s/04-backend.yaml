apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: travelverse
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: souravdasdocker/travelverse-backend:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: travelverse-config
        - secretRef:
            name: travelverse-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "64Mi"
          limits:
            memory: "150Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: travelverse
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
